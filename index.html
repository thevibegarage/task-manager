<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">✓</span>TaskFlow</div>
      <span class="remaining-pill"><span id="remaining-count">0</span> remaining</span>
    </div>

    <section class="hero">
      <div class="hero-text">
        <h1>Stay on top<br />of your day</h1>
        <p>Add tasks, check them off, keep moving.</p>
      </div>
      <svg class="hero-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="14" y="10" width="92" height="100" rx="16" fill="rgba(255,255,255,0.16)" />
        <rect x="28" y="28" width="64" height="12" rx="6" fill="rgba(255,255,255,0.85)" />
        <rect x="28" y="50" width="44" height="10" rx="5" fill="rgba(255,255,255,0.55)" />
        <circle cx="34" cy="76" r="9" fill="#facc15" />
        <path d="M30 76.5l3 3 6-6" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <rect x="50" y="71" width="42" height="10" rx="5" fill="rgba(255,255,255,0.55)" />
        <circle cx="34" cy="97" r="9" fill="rgba(255,255,255,0.35)" />
        <rect x="50" y="92" width="30" height="10" rx="5" fill="rgba(255,255,255,0.35)" />
      </svg>
    </section>

    <form id="task-form" class="task-form-card" autocomplete="off">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        maxlength="200"
        required
      />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <p>No tasks yet. Add one above to get started.</p>
    </div>

    <footer>
      <button id="clear-completed">Clear completed</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
