<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Schibsted+Grotesk:wght@600;800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-color: #F2F5F4;
    background-image:
      linear-gradient(#E3E9E7 1px, transparent 1px),
      linear-gradient(90deg, #E3E9E7 1px, transparent 1px);
    background-size: 30px 30px;
    background-position: -1px -1px;
    font-family: "Schibsted Grotesk", Arial, sans-serif;
    color: #14201D;
    position: relative;
  }
  .left { position: absolute; left: 72px; top: 76px; width: 560px; }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: #5E6D68; font-weight: 500; }
  h1 { font-weight: 800; font-size: 104px; line-height: .95; letter-spacing: -0.035em; margin: 22px 0 28px; }
  h1 span { color: #2B47D1; }
  .dek { font-family: "Source Serif 4", Georgia, serif; font-size: 27px; line-height: 1.35; color: #33423E; margin: 0; max-width: 520px; }
  .foot { position: absolute; left: 72px; bottom: 58px; font-size: 17px; color: #5E6D68; font-weight: 600; letter-spacing: .01em; }
  .foot b { color: #14201D; }
  svg { position: absolute; right: 64px; top: 58px; }
</style></head>
<body>
  <div class="left">
    <div class="eyebrow">RAG · Chunking strategies</div>
    <h1>The Geometry of <span>Chunks</span></h1>
    <p class="dek">Eleven ways to split your documents, and which industry each one fits.</p>
  </div>
  <div class="foot"><b>Garage Labs</b> · ML Engineering</div>

  <svg width="470" height="514" viewBox="0 0 470 514" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="#9A5F05" stroke-width="2.2" opacity=".45"/>
      </pattern>
      <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14201D" flood-opacity=".10"/>
      </filter>
    </defs>

    <!-- page -->
    <rect x="96" y="6" width="362" height="500" rx="6" fill="#FFFFFF" stroke="#D3DBD8" filter="url(#sh)"/>
    <rect x="124" y="34" width="170" height="14" rx="3" fill="#14201D"/>
    <g id="lines" fill="#C9D2CF"></g>

    <!-- overlaps -->
    <rect x="102" y="174" width="350" height="54" fill="url(#hatch)"/>
    <rect x="102" y="324" width="350" height="54" fill="url(#hatch)"/>

    <!-- answer span -->
    <rect x="124" y="186" width="262" height="10" rx="3" fill="#9A5F05"/>
    <rect x="124" y="211" width="190" height="10" rx="3" fill="#9A5F05"/>

    <!-- chunk brackets -->
    <g font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">
      <path d="M86 64 H72 V226 H86" fill="none" stroke="#2B47D1" stroke-width="4" stroke-linejoin="round"/>
      <text x="62" y="150" fill="#2B47D1" text-anchor="end">chunk 1</text>
      <path d="M58 176 H44 V376 H58" fill="none" stroke="#0F8A6E" stroke-width="4" stroke-linejoin="round"/>
      <text x="30" y="276" fill="#0F8A6E" text-anchor="middle" transform="rotate(-90 30 276)">chunk 2</text>
      <path d="M86 326 H72 V494 H86" fill="none" stroke="#B5541A" stroke-width="4" stroke-linejoin="round"/>
      <text x="62" y="420" fill="#B5541A" text-anchor="end">chunk 3</text>
    </g>

    <!-- answer label -->
    <g font-family="Schibsted Grotesk, Arial, sans-serif" font-weight="600" font-size="15" fill="#9A5F05">
      <path d="M404 191 C430 191 436 170 436 150" fill="none" stroke="#9A5F05" stroke-width="2"/>
      <path d="M430 156 L436 146 L442 156" fill="none" stroke="#9A5F05" stroke-width="2"/>
      <text x="436" y="134" text-anchor="end">the answer</text>
    </g>
  </svg>

  <script>
    // text lines on the page
    const g = document.getElementById('lines');
    const widths = [300, 286, 312, 240, 296, 0, 0, 304, 270, 318, 250, 292, 310, 0, 284, 300, 226];
    let y = 86;
    for (const w of widths) {
      if (w) {
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('x', 124); r.setAttribute('y', y); r.setAttribute('width', w);
        r.setAttribute('height', 10); r.setAttribute('rx', 3);
        g.appendChild(r);
      }
      y += 25;
    }
  </script>
</body></html>
